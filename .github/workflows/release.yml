name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  release:
    name: Publish ABI catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check package version
        # language=Bash
        run: |
          package_version="$(yq -r '.package.version' Acton.toml)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$tag_version" != "$package_version" ]; then
            echo "::error title=Version mismatch::Acton.toml(package.version) '${package_version}' does not match tag '${tag_version}'"
            exit 1
          fi

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0

      - name: Build ABI catalog
        run: cargo --locked xtask bundle --out dist/abi-catalog.json

      - name: Write checksum and release notes
        working-directory: dist
        # language=Bash
        run: |
          sha256sum abi-catalog.json > abi-catalog.json.sha256
          checksum="$(cut -d' ' -f1 abi-catalog.json.sha256)"

          contracts=$(jq '.contracts | length' abi-catalog.json)
          acton_version="$(acton --version)"

          {
            echo "ABI catalog with $contracts contracts, built from $GITHUB_SHA with \`$acton_version\`."
            echo
            echo "SHA-256: \`$checksum\`"
          } > ../notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # language=Bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file notes.md \
            dist/*
